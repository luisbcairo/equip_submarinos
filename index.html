h2{font-size:22px;margin:8px 0 4px}h3{font-size:16px;margin:16px 0 6px;color:var(--acc)}
.lead{color:var(--mut);margin:0 0 12px;font-size:14.5px}

.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--tx);padding:8px 12px;border-radius:10px;font-size:13px;cursor:pointer}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}

.tag.ok{border-color:var(--ok);color:#bbf7d0}.tag.bad{border-color:var(--bad);color:#fecaca}.tag.w{border-color:var(--oil);color:#fde68a}
.note{border-left:4px solid var(--oil);background:#2a2210;padding:8px 12px;border-radius:0 10px 10px 0;margin:10px 0;font-size:13.5px}
.note.b{border-color:var(--gas);background:#0b2236}.note.r{border-color:var(--bad);background:#2a1212}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--card2);color:var(--acc)}
.tblwrap{overflow-x:auto}
.flow{stroke-dasharray:3 9;animation:fl 1s linear infinite}.flow.rev{animation-direction:reverse}
.flow.fast{animation-duration:.45s}.flow.slow{animation-duration:2s}
@keyframes fl{to{stroke-dashoffset:-12}}
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(3px) rotate(.6deg)}}
.pulse{animation:pl 1.4s ease-in-out infinite}@keyframes pl{50%{opacity:.35}}
.wave{animation:wv 6s linear infinite}@keyframes wv{to{transform:translateX(-40px)}}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=number],select,input[type=text]{background:#0a1a2b;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:14px;width:100%}
label{font-size:12.5px;color:var(--mut);display:block;margin-bottom:2px}
.kpi{font-size:26px;font-weight:800;color:var(--acc)}.sm{font-size:12px;color:var(--mut)}
.valve-on rect{fill:#16a34a}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0}summary{cursor:pointer;font-weight:600}
.fig{width:100%;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.fig.zoom{position:fixed;inset:2%;z-index:99;width:96%;height:96%;object-fit:contain;cursor:zoom-out;box-shadow:0 0 0 100vw rgba(0,0,0,.8)}
.two{display:grid;gap:12px;grid-template-columns:1fr 1fr}@media(max-width:760px){.two{grid-template-columns:1fr}}
.stepper{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.stepdot{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;background:var(--card);cursor:pointer}

.sr{display:flex;gap:8px}.sr>*{flex:1}
footer{color:var(--mut);font-size:12px;text-align:center;padding:20px}
.stepchip{display:inline-block;padding:6px 11px;border-radius:14px;border:1px solid var(--line);font-size:12.5px;line-height:1.3;background:var(--card);margin:2px}

#pd,#hs{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
nav.chips{display:block;padding:6px 12px 4px;overflow:visible}

header{position:relative}#tools{position:absolute;right:10px;top:10px;display:flex;gap:6px;z-index:5}
.tb2{border:1px solid var(--line);background:var(--card);color:var(--tx);padding:5px 9px;border-radius:8px;font-size:12px;cursor:pointer}
header h1{padding-right:0;margin-top:34px}

CH.push({id:'inst',title:'Instalação de equipamentos',lead:'Como se coloca um manifold, ANM ou módulo no fundo: com sonda, com cabo, roldana, pendular — e por que a profundidade limita o cabo.',render(m){
tabs(m,[
{t:'Manifold & riser',r(b){const M=[['Load-out','Do canteiro para a balsa por vigas e pistões hidráulicos, sincronizado com maré e lastro.'],['Balsa-guindaste','Cabo curto exige lingadas emendadas; vigas laterais sustentam o conjunto durante cada emenda. Lento, caro e arriscado.'],['Barco DP com A-frame','Simples, barato e de baixo risco, mas só para manifolds leves e pequenos.'],['Plataforma de perfuração','Desce pelo riser de perfuração; menos riscos que a balsa, mas muitas etapas.'],['Roldana e pêndulo','Ver aba "Métodos".']];b.appendChild(mk('<div class="grid">'+M.map(m=>`<div class="card"><b style="color:var(--acc)">${m[0]}</b><p>${m[1]}</p></div>`).join('')+'</div>'));b.appendChild(mk('<div class="note b"><b>Pull-in de riser:</b> guinchos de 100–300 t transferem a carga do navio de lançamento para a UEP; trolleys alinham a polia ao I-tube em FPSO com risers no costado. <b>Estaca torpedo</b> (cai por gravidade, penetra ≈20 m) ancora linhas no lugar da estaca de sucção.</div>'));}},
{t:'Métodos',r(b){

 ['Com cabo — rasas e pequeno porte','Balsa-guindaste, guindaste de SS ou AHTS com A-frame. Embarcações de apoio/lançamento têm alta disponibilidade e baixa taxa diária.','#0e7490'],
 ['Com cabo — grande porte / águas profundas','Exige guindaste offshore de grande capacidade, guincho com muito cabo ou descida segmentada com lingadas e spreader bar. A capacidade líquida do cabo cai com o próprio peso. Alternativa: embarcações heavy lift.','#0ea5e9'],

 ['Método pendular','Desenvolvido para instalar manifolds de Roncador com barco tipo AHTS. Usa CTCU (Cable Traction Control Unit) e cabo sintético para contornar o peso do cabo de aço e a ressonância axial. Protótipo de 50 t e 1ª instalação em 2004–2005.','#ea580c']];
 const g=mk('<div class="grid"></div>');M.forEach(x=>g.appendChild(mk(`<div class="card" style="border-left:4px solid ${x[2]}"><b>${x[0]}</b><p>${x[1]}</p></div>`)));b.appendChild(g);
 b.appendChild(mk('<div class="note b">No método da roldana, o RSV participa como <b>posicionamento/referência</b>: coordenadas e azimute da locação, com um segundo RSV de contingência. Para o supervisor de survey, é aqui que a precisão do USBL e a verificação de azimute pesam.</div>'));
}},
{t:'Calculadora do cabo',r(b){
 b.appendChild(mk(`<div><div class="grid">
 <label class="card">MBL do cabo (t)<input type="number" id="mbl" value="665"></label>
 <label class="card">Fator de segurança<input type="number" id="fs" value="3.1" step="0.1"></label>

 <label class="card">Peso submerso do cabo (kgf/m)<input type="number" id="wc" value="36.5" step="0.5"></label>

 <div class="row"><label>Lâmina d'água (m) <input type="range" id="ld" min="0" max="5000" step="50" value="1900"></label><b id="ldv"></b></div><div id="cr" class="card"></div><svg viewBox="0 0 600 220" id="cg"></svg></div>`));

 b.appendChild(mk('<div class="note w">Estimativa didática: capacidade líquida ≈ (MBL/FS)/DAF − peso submerso do cabo × LDA. Os valores iniciais são o exemplo do material (cabo de 4", 665 t, FS 3,1 DNV, DAF 1,2, 36,5 kgf/m). Projeto real exige análise dinâmica, RAO e normas (DNV, API).</div>'));
 b.appendChild(mk('<div class="note b">Além do peso: cabos longos têm <b>ressonância axial</b> (rigidez EA/L). Quando a frequência do movimento vertical da embarcação se aproxima da natural do conjunto cabo+carga, o fator de amplificação dinâmica sobe e pode causar folga do cabo (slack). Cabos sintéticos reduzem peso, mas têm problemas de atrito no tambor, fadiga na polia e abrasão.</div>'));

{t:'Dados de projeto',r(b){

}}],1);

CH.push({id:'dutos',title:'Conexão de dutos',lead:'Como linhas e umbilicais são ligados a ANM, manifold e PLET: horizontal, lay-away, vertical e jumper rígido.',render(m){
tabs(m,[
{t:'Tipos de conexão',r(b){
 const T=[['Horizontal pull-in (DA/DL)','Puxa a extremidade da linha horizontalmente até o hub do equipamento. Assistida por mergulhador (DA) ou diverless (DL). Desenvolvida no Mar do Norte; ferramentas de pull-in e de conexão integradas (ex.: DMaC, a partir de 1995), levadas por ROV. No Brasil foi substituída pelo método lay-away (1986).'],

{t:'PLET, capa de teste & spool',r(b){b.appendChild(mk(`<div class="grid"><div class="card"><b>PLET</b><br><span class="sm">Terminação do duto no leito que o liga ao manifold. Exemplo do material: tubulação 3D pigável, hub de 18¾", válvula gaveta de 10" – 10 ksi, ≈33,6 t, vedação metal×metal, proteção catódica para 35 anos; deslizante no solo para acomodar a dilatação térmica do duto. Alojamento para transponder.</span></div><div class="card"><b>Capa de teste</b><br><span class="sm">Fica travada no hub do PLET e permite teste de vedação da linha (pressão de teste de 15.000 psi no exemplo) com válvula e interface de hot stab de 2". Travamento por alça manipulada pelo ROV.</span></div><div class="card"><b>Spool rígido (jumper)</b><br><span class="sm">Interliga manifold–PLET (com deslocamento do PLET) ou manifold–manifold (deslocamento zero). Maior flexibilidade que a conexão direta. Conjunto spool+spreader de exemplo: ≈68 t.</span></div></div>`));b.appendChild(mk('<div class="note w">O spool é medido pelo survey de metrologia (distância, azimute, inclinação entre hubs) — erros de posição de cm a dm decidem se ele encaixa.</div>'));}},

CH.push({id:'garantia',title:'Garantia de escoamento',lead:'Hidrato, parafina e como o arranjo submarino é pensado para evitar bloqueio de linha.',render(m){

 <tr><td>Corretivas</td><td>dissociação por despressurização da linha (prever essa possibilidade)</td><td>pig (espuma, rígido, multisize) — round trip pigging (pig circulante) ou lançador submarino; SGN (nitrogênio in situ) só como último recurso — risco ao flexível</td></tr></table></div>`));
 b.appendChild(mk('<div class="note b">Por isso existe a válvula <b>PIG cross-over</b> (capítulo Válvulas da ANM): permite pig circulante pela linha de produção e a do anular, que idealmente têm o mesmo diâmetro. Também explica por que o arranjo prevê linhas de serviço e a possibilidade de despressurizar.</div>'));

{t:'SCR × flexível',r(b){b.appendChild(mk(`<div><div class="row"><label>Ângulo de topo (°) <input type="range" id="at" min="2" max="25" value="6"></label><b id="av"></b></div><svg viewBox="0 0 560 220" id="rs3"></svg><div class="card" id="rt3"></div></div>`));const f=()=>{const a=+$('#at',b).value;$('#av',b).textContent=a+'°';const dx=300*Math.tan((90-a)*Math.PI/180)*0+260;const y0=20,top=60,len=170;const rad=a*Math.PI/180;const x1=top+len*Math.sin(rad)*2.2;$('#rs3',b).innerHTML=`<line x1="40" y1="190" x2="520" y2="190" stroke="#475569"/><path d="M${top} ${y0} C${top+len*Math.sin(rad)} ${y0+len*Math.cos(rad)*0.9} ${x1+60} 170 ${x1+140} 190 L520 190" stroke="#a78bfa" stroke-width="4" fill="none"/><text x="${top+10}" y="14" class="t2">topo (UEP)</text><text x="${x1+120}" y="182" class="t2" style="fill:#fcd34d">TDP</text>`;$('#rt3',b).innerHTML=a<=8?'Faixa típica do <b>flexível em catenária</b> (≈5–7°): sensível a compressão no TDP.':a>=14?'Faixa típica do <b>SCR</b> (≈15–20°): menos compressão no TDP, mas exige resistir a grandes trações; usa flexjoint e stress joints.':'Faixa intermediária.'};$('#at',b).oninput=f;f();b.appendChild(mk('<div class="note b">TDP (touch down point) é crítico: cargas compressivas e fadiga. Configurações complacentes (lazy-S, steep-S, steep-wave, lazy-wave) evitam isso, com mais complexidade e risco de clash entre risers. Fontes de fadiga: movimentos de 1ª e 2ª ordem, carga direta de onda, VIV por corrente, HVIV e VIM.</div>'));}},
{t:'Flowline × riser',r(b){

{t:'Tipos de riser',r(b){
 const T=[
 ['Flexível','Camadas (carcaça, barreira de pressão, armaduras, capa). Configurações complacentes (lazy-wave, steep-wave etc., API 17B). Histórico no Brasil: flexíveis a 1000 m em 1991; riser dinâmico a 1800 m em Roncador (P-52, 2005); risers a 2220 m e flowlines até 2500 m no pré-sal (2014). Usado também para injeção de água e químicos.'],
 ['Rígido catenária (SCR)','Aço em catenária; menor custo em grandes diâmetros/pressões; sensível à fadiga no ponto de toque e no topo. Projeto verifica espessura, fadiga por ondas/movimentos, instalação e pull-in/pull-out.'],
 ['TTR — tracionado pelo topo','Riser vertical tracionado. Exige baixo movimento vertical e tração quase constante: em navios e semi-subs só para operações temporárias (perfuração/completação, com desconexão de emergência); em spars e TLPs pode ser permanente e permite <b>completação seca</b>. Conectores sofrem fadiga; requer jumper de fundo.'],
 ['Híbrido','Trecho vertical rígido + trecho flexível até a UEP. Variantes: BHR (torre de risers), RHAS (auto-sustentável com boia), FSHR (free-standing), SLOR/SLHR (single leg), COR/CLHR (concêntrico), BSR (boia de sustentação de risers — Lula NE, Guará). Vantagem: desacoplar os cronogramas de subsea e da UEP.']];
 const g=mk('<div class="grid"></div>');T.forEach(t=>g.appendChild(mk(`<div class="card"><b style="color:var(--acc)">${t[0]}</b><p>${t[1]}</p></div>`)));b.appendChild(g);
 b.appendChild(mk('<div class="note w">Para o RSV/survey: no TTR e nos híbridos, a verticalidade e a posição da base/boia são verificadas por ROV e USBL; os valores de projeto vêm do procedimento do campo.</div>'));

{t:'Umbilical',r(b){
 b.appendChild(mk(`<div><p>Umbilical = mangueiras hidráulicas + cabos elétricos (e eventualmente fibra) dentro de camadas protetoras. Nomenclatura do material: <b>mangueiras + HCR/tubos + CE</b>.</p><div class="row" id="ub"></div><div id="ud" class="card"></div></div>`));

 b.appendChild(mk('<div class="note b">Pares elétricos servem a sensores como TT/TP na ANM e PDG de fundo. HCR = mangueira termoplástica de alta resistência ao colapso. Fabricação: cabling (SZ ou hélice fechada) → capa interna → armação → capa externa → bobina ou cesto (carrossel).</div>'));

,{t:'TTR & riser de sonda',r(b){
 b.appendChild(mk(`<div><div class="card"><b style="color:var(--acc)">Tração mínima do riser de perfuração (API 16Q) — calculadora</b><div class="row"><label>TSRmin (tf) <input type="number" id="t1" value="238.8" style="width:80px"></label><label>N tensionadores <input type="number" id="t2" value="12" style="width:60px"></label><label>n com falha <input type="number" id="t3" value="2" style="width:60px"></label><label>Rf <input type="number" id="t4" value="0.95" step="0.01" style="width:70px"></label></div><div id="t5" class="note b"></div></div></div>`));
 const f=()=>{const a=+$('#t1',b).value,N=+$('#t2',b).value,n=+$('#t3',b).value,R=+$('#t4',b).value;const T=a*N/(R*(N-n));$('#t5',b).innerHTML='Tmin = TSRmin·N / (Rf·(N−n)) = <b>'+(isFinite(T)?T.toFixed(1):'—')+' tf</b> (exemplo do material: 301,6 tf com 12 tensionadores, 2 acoplados ao mesmo banco de ar, Rf 0,95 em perfuração).'};
 $$('input',b).forEach(i=>i.oninput=f);f();
 const C=[['Por que tracionar','Estrutura esbelta: a carga crítica de flambagem é pequena (Pcr = π²EI/L²). Um riser de 21" × 0,75" a 500 m flamba com menos de 1 tf, mas pesa centenas de tf. A tração efetiva é que dá rigidez geométrica (restauração à flexão): Teff = Treal − pi·Ai + pe·Ae.'],
 ['Compensação de heave','Tensionadores wireline ou DAT, DSC, air cans; juntas telescópicas e mangotes. Compensação passiva, hidropneumática, de curso limitado (variação de tração &gt;10% em operação normal). Sem compensação, 2 m de heave com K = 420 tf/m daria 840 tf.'],
 ['Riser de perfuração','Diverter, flexjoint (superior e inferior), junta telescópica com anel tensionador, juntas de 75 ft (nuas ou flutuadas), linhas de choke/kill/booster, LMRP e BOP (mais de 15 m e 400 t). Flutuadores de espuma sintática (fator 0,96 pela API 16Q).'],
 ['Completação / intervenção','Surface flow tree, swivel, slick joint, juntas dual-bore ou concêntricas, stress joint, SCM, EDP (desconexão de emergência em ~30 s) e BOP de workover que cisalha arame e flexitubo. Opera light workover; TH instalado por dentro do riser de perfuração.'],
 ['Produção (TTR)','Só em Spar e TLP: ANM seca no topo (maior confiabilidade), tensionadores sob o wellhead deck, keel joint, juntas concêntricas (dupla barreira). Early Production Riser (Petrobras, 1998; recorde de 1900 m na época; depois no pré-sal em Sapinhoá, Lapa e Búzios).']];
 b.appendChild(mk('<div class="grid">'+C.map(c=>`<div class="card"><b style="color:var(--acc)">${c[0]}</b><p>${c[1]}</p></div>`).join('')+'</div>'));
}}
,{t:'Híbridos (RHAS, torre, BSR)',r(b){
 const H=[['RHAS / SLOR','Riser rígido vertical autossustentado por tanque de flutuação (BT), ligado à UEP por jumper flexível. Rígido a ~200–400 m da UEP; jumper ≈ 1,5× essa distância; BT a 100–200 m de profundidade; base tension ≈ 200 t; BT de ~5–6 m de diâmetro cheio de ar ou N₂. Fundação: estaca cravada, perfurada e cimentada ou de sucção. Exemplo: P-52, export 18", LDA 1800 m, estaca de 120 m.'],
 ['Torre de risers (BHR)','Vários risers em um feixe vertical com espuma sintática e isolamento integrado, tubo central estrutural, guias e jumpers flexíveis. Ex.: Girassol (LDA 1350 m), Greater Plutonio. Vantagem: desacopla movimentos, ótimo isolamento, pré-instalável. Desvantagem: “todos os ovos no mesmo cesto”, difícil inspeção e reparo.'],
 ['BSR — boia de sustentação','SCRs conectados a uma boia submersa que mantém os movimentos do navio desacoplados (conceito do JIP Deepstar, anos 90). Usada em Lula NE e Guará.'],
 ['FSHR','Riser híbrido free-standing; usado em 2010 no Macondo (LDA 1500 m) para captar 20–25 mil b/d.']];
 b.appendChild(mk('<div class="grid">'+H.map(c=>`<div class="card"><b style="color:var(--acc)">${c[0]}</b><p>${c[1]}</p></div>`).join('')+'</div>'));
 b.appendChild(mk('<div class="note b">Vantagem comum: desacoplar o cronograma subsea do da UEP (instalação antes da chegada da plataforma). Limitações comuns: interferência, número limitado de risers e dificuldade de acomodar risers futuros.</div>'));

,{t:'Projeto & análise global',r(b){
 const P=[['Sequência (flexível)','1) seção transversal; 2) configuração do sistema; 3) análise dinâmica global (interferência, tração máxima no topo, raio mínimo no TDP, ângulo de topo, cargas na UEP, bend stiffener); 4) projeto detalhado e fadiga, instalação.'],
 ['Normas','Perfuração: API 16Q/ISO 13624-1. Completação/intervenção: API 17G/ISO 13628-7. Produção: API RP 2RD, DNV; flexíveis: API 17B/17J; SCR: DNV-ST-F201.'],

 ['O que a análise global entrega','Tração máxima, raio mínimo de curvatura e compressão, cargas nos suportes, dados para o enrijecedor, necessidade de ancoragem, interferência com ancoragem/casco, reações para o sistema de ancoragem e esforços para a análise local de fadiga.'],
 ['Método numérico','Elementos discretos; domínio do tempo (implícito ou explícito) ou da frequência; análise acoplada (linhas influenciam a UEP) ou desacoplada. Softwares citados: OrcaFlex, Flexcom, DeepC/Riflex, DERP.'],
 ['Fadiga','Dano em soldas e concentradores: ondas (1ª ordem e direto no riser) e VIV (vórtices da corrente, vibração induzida). Strakes aumentam CD e suprimem vórtices.'],
 ['Janela e desconexão','Janela operacional (offset × tração); deriva de sonda DP: ponto de desconexão (POD) e WSOG com alarmes amarelo e vermelho; recoil após desconexão: levantamento, sem compressão, sem esgotar curso.']];
 b.appendChild(mk('<div class="grid">'+P.map(c=>`<div class="card"><b style="color:var(--acc)">${c[0]}</b><p>${c[1]}</p></div>`).join('')+'</div>'));
}}
,{t:'Flexível: camadas & materiais',r(b){
 const L=[['Carcaça intertravada','Camada mais interna (rough bore): evita colapso por pressão externa/esmagamento, dá resistência à erosão e superfície rígida para pig. Aços 304L/316L, duplex 2205 ou superduplex 2507; escolha por CO₂, H₂S e cloretos.'],
 ['Barreira de pressão','Estanqueidade interna, extrudada: PE reticulado, poliamida PA11/12 ou PVDF. Sujeita a permeação de gases. PA11 sofre hidrólise (critério CIV 1,05 dl/g); PVDF perde plastificante com temperatura.'],
 ['Armadura de pressão','Resiste à pressão interna (hoop) e ao colapso; perfis zeta/teta, com controle do gap.'],

 ['Armaduras de tração','Duas camadas cruzadas (~55° dá equilíbrio de torção); resistem a tração e ao efeito de fundo; projetadas para fadiga em risers.'],
 ['Capa externa','Estanqueidade externa e proteção (PE, XLPE ou PA). Gás permeado acumula no anular; válvulas de vent nos end fittings evitam inflar a capa (diferencial de 2–3 bar).']];

,{t:'Umbilical: tubo × mangueira',r(b){

,{t:'Análise global: casos & métodos',r(b){
 const P=[['Ondas: regular × irregular','Regular: uma onda (H, T) – simples, mas o período escolhido pode estar longe da ressonância do flutuante. Irregular: espectro (Pierson-Moskowitz com Hs e Tz; JONSWAP com fator de pico γ). Resposta: S_R(ω)=RAO²(ω)·S_ζ(ω). Recomendação: ao menos 300 componentes de onda; mar de 3 h.'],
 ['Método híbrido (EHMP)','Onda harmônica equivalente que maximiza amplitudes e acelerações do topo: usa espectro × RAO, extrai máximos estimados (σ=2√m0; umax≈½·√(2 ln N)·σ, N=10800/Tz) e aplica um movimento harmônico no riser. Curto e bom p/ triagem de casos críticos; limitação: não vê a série temporal inteira.'],
 ['Onda irregular (IWP)','Domínio do tempo, séries de 3 h, várias sementes; estatística de extremos (Rayleigh/Weibull). Caro, mas usado para verificar os casos críticos achados pelo método híbrido: maior compressão, SAG/HOG, TDP, ângulo na junta flexível.'],
 ['Wave screening','Cálculo prévio da UEP (1ª+2ª ordem) p/ cada calado, ponto de conexão, 16 direções de onda, períodos de retorno 100/10/1 anos, combinação de carga (ULS/ALS) e fluido interno. Seleciona-se as maiores amplitudes, velocidades e acelerações.'],
 ['Colinear × não colinear','Colinear: onda, vento e corrente na mesma direção (pior caso clássico). Não colinear: perfil de corrente variado ±22,5° em torno das regiões críticas, com offset original e offset zero.'],
 ['Corrente','Perfis por direção (8 ou 16) com referência na superfície ou a 800 m. Operacional (<1 ano): resposta de longo prazo, usada em fadiga. Extrema (1/10/100 anos): resposta de curto prazo.'],
 ['VIV','Análise prévia de extremos define a necessidade e posição dos supressores (strakes × fairings). Identificar zonas de excitação (power-in), curvas S-N interna/externa, in-plane e out-of-plane (Shear7 é 2D). Dano total = curto prazo + longo prazo.'],
 ['Cargas na ET de riser','Offsets estáticos + erro (intacta e linha rompida), ≥3 fluidos (leve, médio, pesado), refinar malha no TDP, de-rating p/ T>50 °C, boias EOL como caso, rigidez da FJ pela história angular do load case.']];
 b.appendChild(mk('<div class="row" id="gx"></div>'));b.appendChild(mk('<div class="card" id="gd"></div>'));
 P.forEach((x,i)=>{const bt=mk('<button class="btn">'+x[0]+'</button>');bt.onclick=()=>{$$('#gx .btn',b).forEach(y=>y.classList.remove('on'));bt.classList.add('on');$('#gd',b).innerHTML='<b>'+x[0]+'</b><p>'+x[1]+'</p>'};$('#gx',b).appendChild(bt);if(!i)bt.click()});
 b.appendChild(mk('<div class="note b">Fluxo de trabalho (flexível): viabilidade → extremos (global com EDT → local analítico axissimétrico → FU de cada camada, API 17J) e fadiga (global com cargas de fadiga → local → dano acumulado → FS ≥ 10).</div>'));
}}
,{t:'Exercício: tração & fadiga',r(b){
 b.appendChild(mk(`<div><div class="row"><label>LDA (m) <input type="range" id="e1" min="600" max="2000" step="50" value="1200"></label><b id="v1"></b></div>
 <div class="row"><label>Pressão interna (MPa) <input type="range" id="e2" min="0" max="30" step="0.5" value="20.5"></label><b id="v2"></b></div>
 <div class="row"><label>Fator dinâmico Fd <input type="range" id="e3" min="1.1" max="2" step="0.05" value="1.35"></label><b id="v3"></b></div>
 <div class="card" id="er"></div></div>`));
 const f=()=>{const L=+$('#e1',b).value,Pi=+$('#e2',b).value*1e6,Fd=+$('#e3',b).value;
 $('#v1',b).textContent=L+' m';$('#v2',b).textContent=(Pi/1e6)+' MPa';$('#v3',b).textContent=Fd.toFixed(2);
 const Ws=450,Fc=1.3,ai=.079,ae=.105,n=175,bb=.002,hh=.005,al=30*Math.PI/180,A=n*bb*hh*Math.cos(al),sy=1260e6;
 const EDT=(L+15)*Ws*Fc*Fd;const sg=(EDT+Math.PI*(Pi*ai*ai))/A;const FU=sg/sy;
 const C=[[1e6,80e3,35e3],[7e5,175e3,120e3],[3e5,425e3,350e3]],Po=2e6;let D=0;
 C.forEach(c=>{const sM=(c[1]+Math.PI*Po*ai*ai)/A,sm=(c[2]+Math.PI*Po*ai*ai)/A,ds=(sM-sm)/1e6;D+=c[0]/(Math.pow(ds,-4)*Math.pow(10,14.917))});
 const life=1/D,FS=life/20;

,{t:'Desacoplados & ambiente',r(b){
 const P=[['Acoplado × desacoplado','Acoplado: o riser liga direto à UEP e recebe toda a excitação; instalação após a UEP. Desacoplado (híbrido): riser rígido ligado a jumper flexível via boia/torre; movimentos amortecidos, pré-instalação possível, menos fadiga.'],
 ['SLWR / lazy-wave','Flutuadores intermediários criam trecho suspenso (SAG/HOG) que filtra vibrações para o TDP. Parâmetros: ângulo de topo, posição, espaçamento e empuxo. Variantes: pliant-wave, lazy-S, steep-wave. Fluido interno muda o empuxo líquido e a configuração (cheio, médio, leve, vazio).'],
 ['MHRT / RHAS / BSR','MHRT: feixe de risers rígidos numa torre com boia no topo, jumpers flexíveis à UEP. RHAS: torre de riser único auto-sustentável. BSR: boia de sustentação submersa; desacopla movimentos e cronogramas, custo de fabricar a boia.'],
 ['Pré-instalação','Abandono do riser no fundo antes da UEP chegar, com ordem de abandono definida. Exemplos: Independence Hub, ERHA, NAKIKA, BC-10.'],
 ['Ondas, correntes, vento','Ondas por Hs×Tp por direção (mar regular ou aleatório); corrente por perfil em profundidade (Morison); vento atua no casco, constante (1 min) ou variável (espectro API/NPD).'],
 ['Materiais','Aço API 5L X65 (X60, X70); titânio na stress joint; CRA/clad/liner/weld overlay p/ CO₂ e H₂S; sobrespessura de corrosão.'],
 ['Revestimento e isolamento','Anticorrosivo, isolamento térmico (garante T do fluido e evita parafina), anti-abrasão. Mais espessura: mais peso submerso e arrasto; menos resposta dinâmica do riser. Pipe-in-pipe: menor troca térmica.']];

,{t:'SCR no mundo',r(b){
 const P=[['Conceito e origem','SCR = riser rígido em catenária livre (free-hanging): tubos de ~12 m soldados (em campo ou em cais) e instalados em catenária; é a forma mais simples de instalar um riser. Nasceu para exportação a partir de unidades de completação seca (Auger, TLP, 1993, 1º SCR), substituindo risers verticais e dutos flexíveis: mais simples e barato, movimentos verticais atenuados pelas exigências dos TTRs, conexão na mesma campanha do duto.'],
 ['Águas rasas e TLP','Plataformas fixas: Bullwinkle (Shell, 1991, LDA 411 m, SCR 24″), GC18A (Exxon, LDA 232 m, 6″). TLPs: Auger (1993), Marco Polo (LDA 1300 m), Shenzi (LDA 1311 m, 2009): linhas de produção de poços afastados por SCR conectados pelo costado.'],
 ['Spar e Truss Spar','Hoover Diana (Exxon, LDA 1460 m, 1999): 1ª instalação de SCR em Spar, 2 linhas de exportação de 12″ e 3 de poços de 6″. Tahiti (Chevron, 2009, 1219 m, 10 SCRs); Perdido (Shell, 2450 m): poços com acesso direto (DVA). Red Hawk (cell spar, 1600 m).'],
 ['Semissubmersíveis','Petrobras P-18 (1998, LDA 910 m): 1ª SS do mundo com SCR, 10″ importação/exportação de gás, ângulo de topo 20°. Atlantis (BP, 2140 m), Na Kika (Shell, 1940 m), Thunder Horse (BP, 1890 m, maior semi-sub), Independence Hub (2438 m). Dificuldade bem maior: movimentos verticais maiores que em completação seca.'],

 b.appendChild(mk('<div class="note b">Quanto mais movimentada a UEP (jaqueta → spar → TLP → SS/SSDD → mono → FPSO), mais difícil o SCR livre: grandes offsets, grandes diâmetros e LDA alta pedem configurações alternativas (lazy-wave, RHAS, MHRT, BSR).</div>'));
 b.appendChild(mk('<div class="note b">Etapas do projeto: seleção de alternativas → conceitual (viabilidade) → básico/FEED (só os risers mais críticos; fornece cargas p/ suportes) → detalhamento (todos os risers, com o casco e sistema de ancoragem reais).</div>'));

,{t:'Critérios & extremos',r(b){
 const P=[['Dimensionamento da espessura','Parte-se do diâmetro (vazão/arranjo) e da espessura: critérios de colapso hidrostático (p_ext>p_int), propagação do colapso e burst (hoop, p_int>p_ext). Colapso considera ovalização, tração e curvatura. Combinações: operação – burst (pressão máxima, parede corroída) e colapso (riser vazio/despressurizado); instalação – colapso (vazio, parede intacta); hidroteste – burst (pressão×fator, parede intacta).'],
 ['API RP 2RD × DNV-ST-F201','API RP 2RD: WSD, tensões admissíveis em função da tensão aparente, coeficientes mais conservadores. DNV-ST-F201: LRFD, estados limites (ULS, ALS, FLS, SLS), classes de segurança baixa/normal/alta, coeficientes parciais (funcional, ambiental, acidental); projeto mais otimizado. A norma deve ser consultada p/ determinar os parâmetros.'],
 ['Cargas extremas','Mostrar que o riser resiste às situações mais severas: baixa probabilidade (100, 10 e 1 ano). Incluir avaria: linha de ancoragem rompida, compartimento alagado na UEP, perda de flutuadores, rompimento de tendão. Resultados: tensões ao longo do riser (topo, TDP, trechos flutuados), pares tração/ângulo p/ a interface (flexjoint, stressjoint), compressão mínima, rotação da flexjoint, esforços de topo p/ o suporte, cargas de pull-in/pull-out e envoltória do TDP p/ evitar choque.'],
 ['Adernamento (ALS3)','Verifica-se o riser na condição acidental de adernamento do casco (regra IMO-MODU), com e sem vento. Posições (ângulos) de equilíbrio obtidas da altura máxima do CG; nas semis, adernamento nas 4 colunas; no FPSO, trim e banda combinados. Costuma gerar os momentos de topo mais críticos.'],
 ['Fluido interno','Variar fluido (operação, máximo e mínimo, riser vazio) e ao longo da vida; densidades alteram peso e configuração, principalmente em lazy-wave. Slug hidrodinâmico (bolhas+pistão, alta frequência) e severo (acúmulo na base, baixa frequência) causam fadiga.']];
 b.appendChild(mk('<div class="row" id="cx"></div>'));b.appendChild(mk('<div class="card" id="cd"></div>'));
 P.forEach((x,i)=>{const bt=mk('<button class="btn">'+x[0]+'</button>');bt.onclick=()=>{$$('#cx .btn',b).forEach(y=>y.classList.remove('on'));bt.classList.add('on');$('#cd',b).innerHTML='<b>'+x[0]+'</b><p>'+x[1]+'</p>'};$('#cx',b).appendChild(bt);if(!i)bt.click()});
 b.appendChild(mk(`<div class="tblwrap"><table><tr><th>Caso</th><th>Onda</th><th>Vento</th><th>Corrente</th><th>Condição</th></tr>
 <tr><td>ULS1 (extremo A)</td><td>100</td><td>10</td><td>10</td><td>Offset c/ ancoragem intacta</td></tr>
 <tr><td>ULS2 (extremo B)</td><td>10</td><td>10</td><td>100</td><td>Offset c/ ancoragem intacta</td></tr>
 <tr><td>ULS3 (operacional)</td><td>1</td><td>1</td><td>1</td><td>Offset c/ ancoragem intacta</td></tr>
 <tr><td>ALS1</td><td>100</td><td>10</td><td>10</td><td>Linha de ancoragem rompida</td></tr>
 <tr><td>ALS2</td><td>1</td><td>1</td><td>1</td><td>Adernamento do casco</td></tr>
</table></div>`));
 b.appendChild(mk('<div class="note b">Períodos de retorno em anos (exemplo de correlação das normas, simplificado; confira os valores exatos na norma). Fator de segurança de classe (γSC): baixa 1,04, normal 1,14, alta 1,26; fator de material 1,15 (ULS/ALS) e 1,0 (SLS/FLS).</div>'));
}}
,{t:'Fadiga: ondas, VIV, VIM',r(b){
 b.appendChild(mk(`<div><div class="row"><label>Dano ondas (anual) <input type="range" id="f1" min="1" max="40" value="8"></label><b id="w1"></b></div>
 <div class="row"><label>Dano VIV (anual) <input type="range" id="f2" min="0" max="40" value="3"></label><b id="w2"></b></div>

 $('#w1',b).textContent=a.toExponential(1);$('#w2',b).textContent=v.toExponential(1);$('#w3',b).textContent=m;
 const D1=10*(a+v),D2=10*Math.pow(Math.pow(a,2/m)+Math.pow(v,2/m),m/2);

 $('#fr',b).innerHTML=`Abordagem 1 (soma linear, DFF=10): D = <b>${D1.toExponential(2)}</b> → vida Vu = <b style="color:${D1<=1?'#34d399':'#f87171'}">${L(D1)} anos</b><br>Abordagem 2 (soma quadrática, DFF=10): D = <b>${D2.toExponential(2)}</b>, Vu = <b>${L(D2)} anos</b><br>Dano anual com DFF já aplicado; Vu=1/D e deve cobrir a vida de serviço.`};
 ['f1','f2','f3'].forEach(i=>$('#'+i,b).oninput=f);f();
 const P=[['Fadiga de ondas e movimentos','Cargas cíclicas variáveis com tensões abaixo da máxima admissível; usa-se a história de tensões e curvas S-N. Etapa 1: tensões nominais σ=F/A ± My·z/I ± Mz·y/I em 16 pontos da seção, p/ cada load case. Etapa 2: contagem de ciclos (rainflow). Etapa 3: dano de Miner D=Σ(nᵢ/Nᵢ)·γᵢ ≤ 1; vida Vu=1/D. Condições bimodais (onda+vento+corrente) em 3 h de mar aleatório, 1 caso por período de retorno. Em duas etapas: offsets e movimentos de baixa frequência pelo modelo acoplado; depois cada riser isolado.'],
 ['Curvas S-N e stress histograms','N=K/S^m, log N = log K − m·log S. Curvas distintas p/ solda (fibra interna e externa) e metal base. Histograma de tensões em intervalos de 0,5 MPa; ni=Σηj(Δσi)γj. Δσ = SCF·Δσnom (hot-spot majorado pelo fator de concentração).'],
 ['VIV','Vórtices desprendem-se do riser em corrente e excitam oscilações, com sincronização na frequência natural. Supressores: strakes (aumentam CD e a área exposta) e fairings (não aumentam CD, mas perdem eficiência em trechos inclinados). Faz-se análise prévia de extremos p/ definir necessidade e posição; em fadiga, perfis de corrente com probabilidades, in-plane e out-of-plane.'],
 ['VIM (movimentos induzidos)','Vórtices desprendem-se do casco flutuante (spar, SS de calado profundo, TLP, mono-coluna). Períodos de 200 a 400 s, auto-limitado. Parâmetros: velocidade reduzida Ur=V·T/D, Strouhal, A/D. SS e TLP têm A/D menor que spar e mono-coluna; strakes reduzem a amplitude. Aumentam CD, cargas no topo, TDP e linhas de ancoragem.'],
 ['Combinação do dano (ET de Riser)','1) Linear: D = DFF1·(Dwave+Dslug)+DFF2·(DVIV+DHVIV), com DFF1=10 e DFF2=20 (VIV ≥10× menor que ondas, ou vice-versa). 2) Soma quadrática: D = DFF·(Dwaveʳ+DVIVʳ+...)^(m/2) com r=2/m, DFF=10. Assunto ainda em consolidação na indústria.'],
 ['Orientações p/ o modelo','Rigidez da FJ em dois passos (valor fixo; depois pela variação angular, escolhendo casos que somem ≥99% do dano nas regiões críticas). Solo: best estimate com 100% de enterramento p/ operacionais e 25% p/ extremos. Cada load case com semente diferente. CD=0,7 (strakes: valor do fabricante, ~1,4). Pode-se desprezar sobrespessura de corrosão se a tensão no CRA não passa do SMYS.']];
 b.appendChild(mk('<div class="row" id="fx"></div>'));b.appendChild(mk('<div class="card" id="fd2"></div>'));
 P.forEach((x,i)=>{const bt=mk('<button class="btn">'+x[0]+'</button>');bt.onclick=()=>{$$('#fx .btn',b).forEach(y=>y.classList.remove('on'));bt.classList.add('on');$('#fd2',b).innerHTML='<b>'+x[0]+'</b><p>'+x[1]+'</p>'};$('#fx',b).appendChild(bt);if(!i)bt.click()});
}}
,{t:'Interferência, instalação, suportes',r(b){
 const P=[['Interferência','Objetivo: verificar se risers vizinhos (rígidos ou flexíveis), o casco ou linhas de ancoragem podem se chocar (clashing) na operação e instalação. Análise em fases; cada fase seleciona casos críticos p/ a seguinte; se algum critério falhar, ajusta-se a configuração e reinicia-se da fase 1. Usar CD amplificado (do VIV) e perfis de corrente (100/10/1 anos, fadiga 98%); casos críticos: clearance < 5·D médio. Riser a montante e a jusante tratados com DAF máximo e mínimo.'],
 ['Instalação','Estabelecer envoltória de condições operacionais (janelas de instalação) pelo barco: rigidez e limites de tração e de dano de fadiga. Métodos: J-lay e reel-lay. Limites p/ pull-in/pull-out, contingências. Diagramas de persistência dão a probabilidade de uma onda com certo Hs não ser excedida durante a operação (ex.: 3 dias, 90% → Hs ≈ 3,75 m). Diagramas de dispersão dão ocorrências por faixa de Hs×Tp por direção.'],
 ['Configurações críticas','Catenária: ângulo de topo na posição final pode ser crítico (menor ângulo), e ângulo fixo na instalação. Lazy-wave: variar o ângulo de topo durante a instalação, instalar o riser cheio d’água ou usar cachos de amarra.'],
 ['Suportes dos risers','Esforços no nó de topo p/ todos os casos (extremos e fadiga) definem a espessura das chapas do suporte. Stressjoint (engaste): maiores esforços. Momentos de flexão mais críticos no topo em ALS3. Séries temporais p/ fadiga do suporte. Usa-se um sistema de referência fixo no topo: eixo x = direção axial do riser em posição neutra; outros eixos = in-plane e out-of-plane da catenária.'],
 ['Flexjoint & stress joint','Flexjoint: elastômero permite rotação entre riser e plataforma, reduzindo o momento; rigidez não linear com o ângulo (maior p/ pequenas variações, enrijece em operação normal); aumento de K = mais dano na fadiga. Stress joint cônica (aço ou titânio): distribui o momento p/ manter tensões admissíveis; dimensionada com análise global sem stressjoint (ângulo, tração, adernamento) e depois isolada.'],
 ['Solo, batimetria e ancoragem','TDZ: solo modelado por molas não lineares (axial, lateral, vertical); rigidez/enterramento influenciam fadiga. Batimetria: fundo plano horizontal, plano médio ajustado ou plano individual por linha. Ancoragem do riser rígido perto do PLET; pode exigir estacas (torpedo).']];

 P.forEach((x,i)=>{const bt=mk('<button class="btn">'+x[0]+'</button>');bt.onclick=()=>{$$('#ix .btn',b).forEach(y=>y.classList.remove('on'));bt.classList.add('on');$('#id2',b).innerHTML='<b>'+x[0]+'</b><p>'+x[1]+'</p>'};$('#ix',b).appendChild(bt);if(!i)bt.click()});
 b.appendChild(mk('<div class="note b">Normas citadas: DNVGL-ST-F101 (dutos), ST-F201 (risers dinâmicos), RP-C203 (fadiga), RP-F204 (fadiga de risers), RP-C205 (ambiente), RP-F203 (interferência); BS 7608; API RP 2RD, API 5L, API 1111.</div>'));
}}

CH.push({id:'ssp',title:'Processamento submarino (SSP)',lead:'Quando bombear e separar no fundo do mar: BCSS, bombeio multifásico, separação, RWI e subsea-to-shore.',render(m){

CH.push({id:'arranjo',title:'Arranjo & UEPs',lead:'Como se decide a "planta" do campo: tipo de plataforma, arquitetura de coleta e os dados que o layout precisa respeitar.',render(m){

CH.push({id:'oceano',title:'Oceanografia aplicada',lead:'Correntes e massas d’água (costa brasileira) e por que isso entra no projeto de risers e na operação com ROV.',render(m){
tabs(m,[
{t:'Vento → corrente',r(b){
 b.appendChild(mk(`<div><div class="row"><label>Vento (m/s) <input type="range" id="vw" min="2" max="30" value="10"></label><b id="vv"></b></div><svg viewBox="0 0 420 200" style="width:100%;height:auto"><defs><marker id="ek" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#38bdf8"/></marker></defs><text x="10" y="18" class="tb" style="fill:#fff;font-size:13px">Espiral de Ekman (hemisfério sul: desvio para a esquerda)</text><g id="sp"></g></svg><div class="card" id="vt"></div></div>`));
 const f=()=>{const w=+$('#vw',b).value;const v=(w*0.03).toFixed(2);$('#vv',b).textContent=w+' m/s';let g='';for(let i=0;i<6;i++){const L=(80-i*11)*(0.4+w/35),x=60,y=40+i*28;g+=`<line x1="${x}" y1="${y}" x2="${x+L}" y2="${y}" stroke="#38bdf8" stroke-width="3" marker-end="url(#ek)" transform="rotate(${-45-i*18} ${x} ${y})"/>`}
  $('#sp',b).innerHTML=g;
  $('#vt',b).innerHTML='Com vento de <b>'+w+' m/s</b>, a corrente superficial teórica é cerca de <b>'+v+' m/s</b> (≈3% da velocidade do vento). A velocidade cai e o sentido gira com a profundidade; o movimento cessa por volta de ~100 m (profundidade de influência do atrito), e o transporte líquido de Ekman fica a 90° do vento.'};
 $('#vw',b).oninput=f;f();
 b.appendChild(mk(`<div class="grid"><div class="card"><b style="color:var(--acc)">Circulação horizontal</b><p>Alísios e ventos de oeste geram, por atrito, as correntes superficiais e os giros subtropicais (anti-horário no HS). A corrente geostrófica é o equilíbrio entre gravidade e Coriolis e se intensifica na borda oeste dos giros (por isso a Corrente do Brasil é quente e rápida).</p></div><div class="card"><b style="color:var(--acc)">Circulação vertical</b><p>Ressurgência (vento afasta a água superficial; aflora água fria e rica em nutrientes — ex.: Cabo Frio, com a ACAS) e circulação termoalina (águas densas afundam em altas latitudes e fluem a cerca de 1 cm/s).</p></div></div>`));
}},
{t:'Massas d’água (costa BR)',r(b){
 const M=[['AT — Água Tropical','S &gt; 35,9 · T &gt; 18 °C','até ~200 m','Fluxo predominante para sudoeste; é a água da Corrente do Brasil.'],['ACAS — Água Central do Atlântico Sul','S 35,9→34,6 · T 18→8 °C','~100–800 m','Formada na Convergência Subtropical (~40°S); flui para norte sob a Corrente do Brasil e, no verão, sobe à plataforma (ressurgência).'],['AIA — Água Intermediária Antártica','T &lt; 8 → 4,6 °C · mínimo de salinidade','até ~1500 m','Formada na Convergência Antártica (~50°S); pode ser detectada até ~25°N.'],['APAN — Água Profunda do Atlântico Norte','S e O₂ máximos','~1500–2000 m','Formada na Groenlândia; chega até a Antártica.'],['AAF — Água Antártica de Fundo','T ~1,9 °C · S ~34,6','fundo','Formada no Mar de Weddell; a mais fria de todas.']];
 b.appendChild(mk('<div class="row" id="mb"></div>'));b.appendChild(mk('<div class="card" id="md"></div>'));
 const LY=[['#f59e0b',0,150],['#22d3ee',150,800],['#6366f1',800,1500],['#a855f7',1500,2200],['#1e3a8a',2200,3000]];
 const sc=d=>20+d*0.09;
 b.appendChild(mk('<div class="card" style="padding:4px"><svg viewBox="0 0 420 300" style="width:100%;height:auto;display:block"><text x="8" y="14" class="t2" style="font-size:12px">profundidade (m) — esquema, faixas variam entre autores</text>'+LY.map((l,i)=>`<g class="hot" data-i="${i}"><rect x="70" y="${sc(l[1])}" width="170" height="${sc(l[2])-sc(l[1])}" fill="${l[0]}" opacity=".75" stroke="#fff" stroke-opacity=".4"/><text x="155" y="${(sc(l[1])+sc(l[2]))/2+5}" text-anchor="middle" class="tb" style="fill:#fff;font-size:14px">${['AT','ACAS','AIA','APAN','AAF'][i]}</text></g>`).join('')+[0,500,1000,1500,2000,2500,3000].map(d=>`<text x="62" y="${sc(d)+4}" text-anchor="end" class="t2" style="font-size:11px">${d}</text>`).join('')+'<text x="255" y="40" class="t2" style="font-size:12px">quente · S alta</text><text x="255" y="150" class="t2" style="font-size:12px">T 18→8 °C</text><text x="255" y="235" class="t2" style="font-size:12px">mín. de salinidade (AIA)</text><text x="255" y="285" class="t2" style="font-size:12px">mais fria (AAF)</text><path d="M60 30 V285" stroke="#9db8d0" stroke-width="1"/></svg></div>'));

 M.forEach((x,i)=>{const bt=mk('<button class="btn">'+x[0].split(' — ')[0]+'</button>');bt.onclick=()=>{$$('#mb .btn',b).forEach(y=>y.classList.remove('on'));bt.classList.add('on');$('#md',b).innerHTML='<b>'+x[0]+'</b><br>'+x[1]+' · '+x[2]+'<p>'+x[3]+'</p>'};$('#mb',b).appendChild(bt);if(!i)bt.click()});
 b.appendChild(mk('<div class="note b">Massa d’água = faixa característica de T e S adquirida na superfície, que só muda por mistura. No diagrama T-S cada massa aparece como um trecho da curva. Água Costeira e da Plataforma têm salinidade mais baixa pela influência continental.</div>'));
 b.appendChild(mk('<div class="note w">Os limites de profundidade e a salinidade do núcleo da AIA variam entre autores; use estes valores como referência de curso, não como norma.</div>'));
}},
{t:'Correntes do Brasil & ENSO',r(b){
 const O1='#f59e0b',O2='#fb923c',C1='#38bdf8',G1='#a3e635';
 b.appendChild(mk(`<div class="card" style="padding:4px"><svg viewBox="0 0 420 340" style="width:100%;height:auto;display:block"><polygon points="0,0 0,340 120,340 128,280 158,215 170,150 158,100 120,50 80,20 48,0" fill="#14532d" opacity=".55" stroke="#4ade80"/><text x="50" y="200" text-anchor="middle" class="tb" style="fill:#bbf7d0;font-size:14px">Brasil</text>${pipe('M410 80 H185',O1,6)}${pipe('M185 80 L120 20',O2,5)}${pipe('M185 82 C195 150 210 215 250 262',O1,7)}${pipe('M330 335 C290 310 270 285 250 262',C1,6)}${pipe('M250 262 H410',G1,5)}<text x="408" y="68" text-anchor="end" class="tb" style="fill:#fdba74;font-size:13px">Sul Equatorial</text><text x="112" y="14" text-anchor="end" class="tb" style="fill:#fdba74;font-size:12px">C. Guianas</text><text x="196" y="178" class="tb" style="fill:#fdba74;font-size:13px">C. do Brasil</text><text x="408" y="326" text-anchor="end" class="tb" style="fill:#7dd3fc;font-size:13px">C. Malvinas</text><text x="408" y="250" text-anchor="end" class="tb" style="fill:#d9f99d;font-size:12px">Conv. Subtropical (~38°S)</text><text x="300" y="150" text-anchor="middle" class="t2" style="font-size:12px">Oceano Atlântico</text><text x="410" y="170" text-anchor="end" class="t2" style="font-size:11px">→ África</text></svg></div>`));

 b.appendChild(mk(`<div class="grid"><div class="card"><b style="color:var(--acc)">Sul Equatorial → bifurcação</b><p>A Corrente Sul Equatorial bifurca na costa nordestina: para o norte, Corrente das Guianas (Norte do Brasil); para o sul, <b>Corrente do Brasil</b>, que segue pela borda da plataforma até ~38°S.</p></div><div class="card"><b style="color:var(--acc)">Convergência Subtropical</b><p>Encontro da Corrente do Brasil (tropical, menos densa) com a Corrente das Malvinas (fria, mais densa, ramo da Circumpolar): as duas se afastam da costa rumo ao leste.</p></div><div class="card"><b style="color:var(--acc)">El Niño / La Niña</b><p>El Niño: aquecimento anormal do Pacífico equatorial, alísios mais fracos, intervalos de 2 a 7 anos (média 3–4). La Niña: esfriamento oposto. No Atlântico os eventos ocorrem 12–18 meses depois, segundo o material.</p></div><div class="card"><b style="color:var(--acc)">Frentes e ventos</b><p>Frentes frias mudam a direção do vento e, portanto, de ondas e correntes; podem se deslocar a ~64 km/h. Brisa marítima à tarde, terrestre ao amanhecer.</p></div></div>`));
}},

,{t:'Ressurgência & termoalina',r(b){

CH.push({id:'pocos',title:'Nomenclatura de poços',lead:'Como ler o nome ANP de um poço (ex.: 7-PRG-57HA-RJS): categoria, referência nominal, sequencial, tipo e UF.',render(m){
const CAT=[['1','Pioneiro','Testa petróleo/gás em objetivos de um prospecto geológico.'],['2','Estratigráfico','Conhece a coluna estratigráfica da bacia e obtém informações geológicas.'],['3','Extensão','Delimita a acumulação em um reservatório.'],['4','Pioneiro Adjacente','Testa ocorrência em área adjacente a uma descoberta.'],['5','Prospecto (jazida) mais raso','Testa jazidas mais rasas na área.'],['6','Prospecto (jazida) mais profundo','Testa jazidas mais profundas na área.'],['7','Produção (explotatório)','Drena uma ou mais jazidas de um campo.'],['8','Injeção (explotatório)','Injeta fluidos para recuperação ou manutenção de energia do reservatório.'],['9','Especial','Operação específica que não se enquadra nas anteriores.'],['10','Estocagem','Armazenamento (categoria incluída na Res. ANP 699/2017).']];
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function dec(n){
 const r=/^(\d{1,2})-([A-Za-z]{1,4})-(\d+)([A-Za-z]*)(?:-([A-Za-z]+))?$/.exec(n.trim());
 if(!r)return '<div class="note r">Formato não reconhecido. Padrão: <b>categoria-REF-sequencial[tipo]-UF</b>, ex.: 7-PRG-57HA-RJS.</div>';
 const c=CAT.find(x=>x[0]===r[1]);const ex=+r[1]<=6;
 let t=[];for(const ch of r[4]){if(ch==='D')t.push('<b>D</b> direcional');else if(ch==='H')t.push('<b>H</b> horizontal');else if(ch==='P')t.push('<b>P</b> partilhado/multilateral');else if(ch==='i')t.push('<b>i</b> poço de investigação (riscos rasos; mesmo sequencial do definitivo)');else t.push('<b>'+esc(ch)+'</b> repetido (reperfurado após perda do poço original; sequência A, B, C… pulando D, H e P)')}
 let uf='';if(r[5]){const u=r[5].toUpperCase();uf=/^[A-Z]{2}S$/.test(u)?'<b>'+u.slice(0,2)+'</b> + <b>S</b> → poço marítimo, confrontante com o estado '+u.slice(0,2):(/^[A-Z]{2}$/.test(u)?'<b>'+u+'</b> → estado (poço terrestre)':'<b>'+esc(r[5])+'</b> → complemento fora do padrão (ex.: “TESTE” no exemplo do manual da ANP) ou sigla de bacia + S')}
 return '<div class="grid"><div class="card"><b style="color:var(--acc)">Categoria '+esc(r[1])+'</b><p>'+(c?c[1]+': '+c[2]:'Código fora da lista 1–10')+'</p></div><div class="card"><b style="color:var(--acc)">Referência nominal: '+esc(r[2].toUpperCase())+'</b><p>'+(ex?'Poço exploratório: sigla do operador (ex.: BRSA = Petrobras).':+r[1]<=8?'Poço explotatório: sigla do campo.':'Poço especial: operador (área exploratória) ou campo (área explotatória).')+'</p></div><div class="card"><b style="color:var(--acc)">Sequencial: '+esc(r[3])+'</b><p>'+(ex?'Ordem cronológica de perfuração por operador.':'Ordem cronológica de perfuração no campo.')+'</p></div><div class="card"><b style="color:var(--acc)">Tipo</b><p>'+(t.length?t.join('<br>'):'Sem sufixo: poço vertical.')+'</p></div><div class="card"><b style="color:var(--acc)">Referência geográfica</b><p>'+(uf||'Não informada.')+'</p></div></div>'}
tabs(m,[
{t:'Decodificador',r(b){
 b.appendChild(mk('<div><div class="row"><input id="pn" value="7-PRG-57HA-RJS" style="flex:1;min-width:180px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:inherit;font-size:16px"></div><div class="row" id="px"></div><div id="po"></div></div>'));
 const go=()=>{$('#po',b).innerHTML=dec($('#pn',b).value)};
 [['7-PRG-57HA-RJS','Exemplo da ANP (tabela de poços)'],['9-RO-234-TESTE','Exemplo do manual de notificação'],['1-XYZ-1-RJS','Ilustrativo: 1º pioneiro de um operador']].forEach(x=>{const bt=mk('<button class="btn">'+x[0]+'</button>');bt.title=x[1];bt.onclick=()=>{$('#pn',b).value=x[0];go()};$('#px',b).appendChild(bt)});
 $('#pn',b).oninput=go;go();
 b.appendChild(mk('<div class="note b">Digite ou toque num exemplo. Nome ANP: até 20 caracteres.</div>'));
}},
{t:'Categorias 1–10',r(b){
 b.appendChild(mk('<div class="tblwrap"><table><tr><th>Cód.</th><th>Finalidade</th><th>O que é</th></tr>'+CAT.map(c=>'<tr><td><b>'+c[0]+'</b></td><td>'+c[1]+'</td><td>'+c[2]+'</td></tr>').join('')+'</table></div>'));
 b.appendChild(mk('<div class="note b">1 a 6 = poços exploratórios; 7 e 8 = explotatórios (produção e injeção); 9 = especial; 10 = estocagem. Locação é obrigatória para 1–6; identificação PAT para 7–9.</div>'));
}},
{t:'Estrutura & sufixos',r(b){
 b.appendChild(mk(`<div class="grid"><div class="card"><b style="color:var(--acc)">1 · Categoria</b><p>Número de 1 a 10 (finalidade).</p></div><div class="card"><b style="color:var(--acc)">2 · Referência nominal</b><p>2 a 4 letras: operador (exploratório) ou campo (explotatório).</p></div><div class="card"><b style="color:var(--acc)">3 · Sequencial</b><p>Ordem cronológica de perfuração.</p></div><div class="card"><b style="color:var(--acc)">4 · Tipo (sufixo)</b><p>Geometria/condição do poço.</p></div><div class="card"><b style="color:var(--acc)">5 · UF</b><p>Sigla do IBGE; no mar acrescenta-se S (ex.: RJS). Em poços marítimos é o estado confrontante.</p></div></div>`));
 b.appendChild(mk(`<div class="tblwrap"><table><tr><th>Sufixo</th><th>Significado</th></tr><tr><td>(nenhum)</td><td>Vertical</td></tr><tr><td><b>D</b></td><td>Direcional: perfurado fora da vertical para atingir objetivo específico</td></tr><tr><td><b>H</b></td><td>Horizontal: atinge o objetivo de forma horizontal ou sub-horizontal</td></tr><tr><td><b>A, B, C, E…</b></td><td>Repetido (reperfurado após perda do poço, mesmos objetivos); sequência pulando D, H e P</td></tr><tr><td><b>P</b></td><td>Partilhado ou multilateral: aproveita um poço ou parte dele com objetivos diferentes</td></tr><tr><td><b>i</b></td><td>Investigação de riscos geológicos rasos (shallow hazards), com o mesmo sequencial do poço definitivo</td></tr></table></div>`));
 b.appendChild(mk('<div class="note w">Os sufixos acima vêm da Resolução ANP 49/2011, hoje revogada pela Resolução ANP 699/2017, que acrescentou a categoria 10 e detalha a codificação. Confirme na 699/2017 se precisar do texto oficial vigente.</div>'));
}},
{t:'Nome ANP × nome Petrobras',r(b){

ulante = ida e volta por 2 linhas.'],['Lay-away','Conexão de duto feita durante o lançamento, sem pull-in.'],['RAO','Response Amplitude Operator: resposta da embarcação à onda.'],['DAF','Dynamic Amplification Factor.'],['CTCU','Cable Traction Control Unit (método pendular).'],['WROV / MSROV / OROV','Classes de ROV: trabalho (>1000 kg), médio porte e observação.'],['BCSS','Bombeio centrífugo submerso submarino.'],['MOBO','Módulo de bombeamento em poço falso.'],['VASPS','Separador vertical anular + bombeamento.'],['RWI','Raw Water Injection: injeção de água do mar captada no leito.'],['SCR','Steel Catenary Riser: riser rígido em catenária.'],['TTR','Top Tensioned Riser.'],['UTA','Umbilical Termination Assembly.'],['SDU / EDU','Unidades de distribuição hidráulica/química e elétrica.'],['ILT','In-line tee.'],['MTU','Módulo de terminação de umbilical.'],['EHDM','Módulo de distribuição eletro-hidráulica.'],['TDP','Touch down point do riser.'],['Flexjoint / stress joint','Juntas que reduzem momento no topo/TDP do riser.'],['DPPS','Diagrama polar de posicionamento de sondas (bolha assassina).'],['PSL','Product Specification Level (API 17D).'],['H4','Perfil/conector da cabeça de poço (anel VX).'],['CDH','Caixa de distribuição hidráulica.'],['UEH','Umbilical eletro-hidráulico.'],['Piggyback','ANMs ligadas em série.'],['Spool / jumper rígido','Trecho rígido pré-medido entre dois hubs.']];
